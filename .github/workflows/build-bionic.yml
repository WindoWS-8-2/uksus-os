name: build-risos-noble
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Build RisOS ISO
        run: |
          cd scripts
          # Убедимся, что версия Noble и имя risos
          sed -i 's/TARGET_UBUNTU_VERSION=.*/TARGET_UBUNTU_VERSION="noble"/' default_config.sh
          sed -i 's/TARGET_NAME=.*/TARGET_NAME="risos"/' default_config.sh
          
          # Запускаем сборку с sudo (так как нужен root для debootstrap/chroot)
          sudo ./build.sh -
          
      - name: Archive RisOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: risos-26.27-iso
          path: |
            scripts/risos.iso
            scripts/image/md5sum.txt
